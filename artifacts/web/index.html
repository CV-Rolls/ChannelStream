<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: critical for iPhone notch/home-bar safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- PWA / Apple mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NetStream" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- PWA manifest (enables "Add to Home Screen" on iOS + Android) -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS home-screen icon (Android uses manifest icons) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Search engine / crawler exclusion — private app, no indexing -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <!-- OpenGraph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NetStream – Live TV" />
    <meta property="og:description" content="Watch 8,000+ live global channels — free, no login required." />
    <meta property="og:image" content="/opengraph.jpg" />
    <title>NetStream – Live TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
